<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي القسمة الإقليدية - المربي أمين محمدي</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header-info {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .teacher-name {
            color: #2980b9;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 3px;
        }
        .school-context {
            color: #7f8c8d;
            font-size: 13px;
        }
        .score-board {
            font-size: 17px;
            color: #27ae60;
            margin-bottom: 15px;
            font-weight: bold;
            background: #e8f8f5;
            padding: 8px;
            border-radius: 8px;
        }
        .question-box {
            font-size: 18px;
            background: #f1f2f6;
            border-right: 5px solid #3498db;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: right;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #dcdde1;
            text-align: right;
        }
        .option-btn:hover {
            background-color: #dfe4ea;
            border-color: #3498db;
        }
        #feedback {
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
        }
        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }
        #next-btn {
            display: none;
            margin-top: 20px;
            background-color: #27ae60;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 تقييم مهارات الحساب: القسمة الإقليدية</h1>
    
    <div class="header-info">
        <div class="teacher-name">إعداد المربي: أمين محمدي</div>
        <div class="school-context">تلاميذ السنة الخامسة أساسي | المدرسة التونسية بالدوحة</div>
    </div>
    
    <div class="score-board">
        السؤال: <span id="current-level">1</span> / <span id="total-levels">10</span> &nbsp;|&nbsp; 
        العلامة: <span id="score">0</span> / 20 نقطة
    </div>
    
    <div id="quiz-container">
        <div class="question-box" id="question-text">جاري تحضير التقييم...</div>
        <div class="options" id="options-container"></div>
    </div>
    
    <div id="feedback"></div>
    <button class="btn" id="next-btn" onclick="nextQuestion()">السؤال الموالي ⟵</button>
</div>

<script>
    const questions = [
        {
            question: "السؤال 1: أراد فلاح توزيع 84 شجرة تفاح بالتساوي على 9 صفوف. كم شجرة يضع في كل صف، وكم شجرة تبقى؟",
            options: [
                "9 شجرات في كل صف والباقي 3 شجرات",
                "8 شجرات في كل صف والباقي 12 شجرة",
                "9 شجرات في كل صف والباقي 0 شجرة"
            ],
            answer: 0,
            explanation: "9 × 9 = 81، والباقي من 84 هو 3 شجرات."
        },
        {
            question: "السؤال 2: في عملية قسمة إقليدية، إذا كان المقسوم عليه هو 7، فما هي الشروط الأساسية للباقي؟",
            options: [
                "الباقي يمكن أن يساوي 7 أو أكبر منه",
                "الباقي أصغر قطعاً من المقسوم عليه وأكبر من أو يساوي الصفر",
                "الباقي يجب أن يكون مساوياً للصفر دائماً"
            ],
            answer: 1,
            explanation: "قاعدة القسمة الإقليدية تحتم أن يكون الباقي دائماً أصغر من المقسوم عليه."
        },
        {
            question: "السؤال 3: اشترى مكتب 95 قلماً ليوزعها على مجموعات متساوية تضم كل منها 8 أقلام. ما هو عدد المجموعات الكاملة؟",
            options: [
                "10 مجموعات والباقي 15 قلماً",
                "11 مجموعة والباقي 7 أقلام",
                "12 مجموعة والباقي 0 قلم"
            ],
            answer: 1,
            explanation: "8 × 11 = 88، والباقي 95 - 88 = 7 أقلام."
        },
        {
            question: "السؤال 4: ما هو العدد الذي إذا قسمناه على 6 حصلنا على الحاصل 12 والباقي 4؟",
            options: [
                "76 (لأن 12 × 6 + 4 = 76)",
                "72 (لأن 12 × 6 = 72)",
                "70 (لأن 12 × 6 - 2 = 70)"
            ],
            answer: 0,
            explanation: "المقسوم = (المقسوم عليه × الحاصل) + الباقي أي (6 × 12) + 4 = 76."
        },
        {
            question: "السؤال 5: صبت كمية من الحليب قدرها 67 لتراً في أوانٍ تسع كل واحدة 5 لترات. كم إناءً امتلأ كلياً؟",
            options: [
                "12 إناءً",
                "13 إناءً والباقي لتران",
                "14 إناءً"
            ],
            answer: 1,
            explanation: "5 × 13 = 65، ويتبقى لتران خارج الأواني الكاملة."
        },
        {
            question: "السؤال 6: لمعرفة عدد الأكياس اللازمة لتعبئة 135 كغ من الدقيق بسعة 10 كغ للكيس الواحد، ما هي العملية المناسبة؟",
            options: [
                "القسمة الإقليدية لـ 135 على 10 (الحاصل 13 والباقي 5)",
                "ضرب 135 في 10",
                "طرح 10 من 135"
            ],
            answer: 0,
            explanation: "التوزيع والاحتواء يعتمد على القسمة لاستخراج الأكياس الكاملة."
        },
        {
            question: "السؤال 7: إذا كان باقي قسمة عدد على 5 هو 3، وحاصل القسمة هو 14، فما هو هذا العدد؟",
            options: [
                "70",
                "73 (لأن 14 × 5 + 3 = 73)",
                "67"
            ],
            answer: 1,
            explanation: "(14 × 5) + 3 = 70 + 3 = 73."
        },
        {
            question: "السؤال 8: وزع الأب مبلغ 92 ديناراً بالتساوي على أطفاله الأربعة. كم نصيب كل طفل؟",
            options: [
                "21 ديناراً والباقي 8 دنانير",
                "23 ديناراً والباقي 0 دينار",
                "22 ديناراً والباقي 4 دنانير"
            ],
            answer: 1,
            explanation: "4 × 23 = 92، القسمة تامة والباقي صفر."
        },
        {
            question: "السؤال 9: ملعب مدرسة فيه 115 تلميذاً، أراد المعلم تنظيمهم في صفوف متساوية يضم كل صف 12 تلميذاً. ما هو عدد الصفوف التامة؟",
            options: [
                "9 صفوف والباقي 7 تلاميذ",
                "10 صفوف والباقي 0 تلميذ",
                "8 صفوف والباقي 19 تلميذاً"
            ],
            answer: 0,
            explanation: "12 × 9 = 108، والباقي 115 - 108 = 7 تلاميذ."
        },
        {
            question: "السؤال 10: في متساوية القسمة الإقليدية: 54 = (7 × 7) + 5، ما هو ممثل 'الباقي'؟",
            options: [
                "العدد 54",
                "العدد 7",
                "العدد 5"
            ],
            answer: 2,
            explanation: "الباقي هو العدد المضاف في الأخير وهو هنا 5."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const scoreSpan = document.getElementById("score");
    const currentLevelSpan = document.getElementById("current-level");
    document.getElementById("total-levels").innerText = questions.length;

    function loadQuestion() {
        feedback.innerHTML = "";
        nextBtn.style.display = "none";
        const q = questions[currentQuestionIndex];
        questionText.innerText = q.question;
        optionsContainer.innerHTML = "";
        currentLevelSpan.innerText = currentQuestionIndex + 1;

        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.classList.add("btn", "option-btn");
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex) {
        const q = questions[currentQuestionIndex];
        const optionButtons = optionsContainer.getElementsByTagName("button");
        
        for(let btn of optionButtons) {
            btn.disabled = true;
        }

        if (selectedIndex === q.answer) {
            feedback.innerHTML = `<span class="correct">✔️ إجابة صحيحة! ${q.explanation}</span>`;
            score += 2; // كل سؤال بنقطتين
            scoreSpan.innerText = score;
        } else {
            feedback.innerHTML = `<span class="wrong">❌ إجابة خاطئة. الصحيح هو: ${q.options[q.answer]}</span>`;
        }

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.style.display = "block";
        } else {
            setTimeout(() => {
                let resultMessage = "";
                let resultColor = "";
                
                // تقييم واقعي صارم دون مجاملة عند الفشل
                if (score >= 14) {
                    resultColor = "#27ae60";
                    resultMessage = "أداء متميز يعكس استيعاباً سليماً للقواعد والمنهجية الرياضية. واصل على هذا النهج.";
                } else if (score >= 10) {
                    resultColor = "#d35400";
                    resultMessage = "النتيجة متوسطة وتحتاج إلى تركيز أكبر، خاصة في استخراج المعطيات وتفكيك المسائل بوعي.";
                } else {
                    resultColor = "#c0392b";
                    resultMessage = "نتيجة غير مرضية تدل على قصور واضح في استيعاب المفاهيم الأساسية للقسمة. يتطلب الأمر مراجعة جادة ومعمقة للدرس.";
                }

                document.getElementById("quiz-container").innerHTML = `
                    <h2 style="color: ${resultColor};">نتيجة التقييم النهائي</h2>
                    <p style="font-size: 22px; font-weight: bold;">العلامة المحصل عليها: ${score} / 20</p>
                    <p style="font-size: 16px; line-height: 1.6; margin-top: 15px;">${resultMessage}</p>
                    <p style="margin-top: 25px; color: #2980b9; font-weight: bold; border-top: 1px solid #ddd; padding-top: 15px;">إعداد المربي: أمين محمدي - المدرسة التونسية بالدوحة</p>
                `;
                feedback.innerHTML = "";
                nextBtn.style.display = "none";
            }, 1500);
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
